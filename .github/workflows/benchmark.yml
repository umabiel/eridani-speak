name: Benchmark

# Manual benchmark run against a real LLM. No API key is committed; provide
# LLM_API_KEY (and optionally LLM_BASE_URL) as repository secrets.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Suite to run (all or one category)'
        required: false
        default: 'all'
      model:
        description: 'Model name'
        required: false
        default: 'gpt-4o-mini'

jobs:
  benchmark:
    runs-on: ubuntu-latest
    env:
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_MODEL: ${{ inputs.model }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run validate-fixtures
      - name: Run evaluation
        run: npm run eval -- --suite ${{ inputs.suite }}
      - uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: results/
